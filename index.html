<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:MC;src:url('assets/Minecraft.ttf')}
html,body{margin:0;background:transparent;overflow:hidden;font-family:MC,'Courier New',monospace;-webkit-font-smoothing:none;user-select:none}
#wrap{height:150px;display:flex;align-items:flex-end;justify-content:center;padding:0 10px 12px;box-sizing:border-box}
#bub{display:none;position:relative;width:fit-content;max-width:310px;box-sizing:border-box;padding:7px 12px;
 background:#fff;color:#2b2b2b;font-size:15px;font-weight: bold;line-height:1.35;border:3px solid #111;
 box-shadow:inset -3px -3px 0 #c6c6c6,0 3px 0 rgba(0,0,0,.25)}
#bub::after{content:'';position:absolute;left:50%;bottom:-11px;width:10px;height:10px;background:#fff;
 border:3px solid #111;border-top:none;border-left:none;transform:translateX(-50%) rotate(45deg)}
#bub b{color:#e0398c}
canvas{display:block;width:340px;height:310px;cursor:grab}
#inp{display:none;position:absolute;left:30px;right:30px;bottom:6px;box-sizing:border-box;padding:6px 10px;
 background:#fff;border:3px solid #111;box-shadow:inset -3px -3px 0 #c6c6c6;color:#2b2b2b;font:15px MC,'Courier New',monospace;outline:none}
</style>
<div id="wrap"><div id="bub"></div></div><canvas id="c" width="340" height="310"></canvas>
<input id="inp" placeholder="Talk to Axo... (Enter)"><script src="renderer.js"></script>
